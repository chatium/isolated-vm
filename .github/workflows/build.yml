name: Build & Test

on: [push, pull_request]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # No macos-latest: hosted macOS runners are often unavailable and too slow for the timing
        # tests (large-strings.js); run `CI=1 npm test` on a Mac locally instead
        os: [ ubuntu-latest, windows-latest ]
        node: [ 22, 24 ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Add msbuild to PATH
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2
      - name: Install node-gyp
        if: matrix.os == 'windows-latest'
        run: |
          npm install --global node-gyp@latest
      - name: Build
        if: matrix.os != 'windows-latest'
        run: |
          npm install --build-from-source
      # npm's install script runs the node-gyp npm bundles, and Node 22's (11.5) cannot find VS 18
      - name: Build (global node-gyp)
        if: matrix.os == 'windows-latest'
        run: |
          npm install --ignore-scripts && node "$(npm prefix -g)\node_modules\node-gyp\bin\node-gyp.js" rebuild --release -j max
      - name: Test
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 6
          command: |
            npm test

  build-and-test-alpine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 22, 24 ]
      fail-fast: false
    container: node:${{ matrix.node }}-alpine
    steps:
      - uses: actions/checkout@v6
      - name: install build deps
        run: |
          apk add g++ make python3
      - name: Build
        run: |
          npm install --build-from-source
      - name: Test
        run: |
          npm test
        timeout-minutes: 4
